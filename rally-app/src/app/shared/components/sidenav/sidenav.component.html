<mat-sidenav-container class="app">
  <mat-sidenav #appDrawer mode="over" opened="false" class="sidebar">
    <nav class="sidebar-nav">
      <ul>
        @for (item of menu.items; track item.name) {
          <li>
            @if (item.children && item.children.length > 0) {
              <!-- Grupo (p. ej. Catálogos): no es un destino; sus opciones se ven desplegadas -->
              <span class="group-title">{{ item.name }}</span>
              <ul class="sub-list">
                @for (child of item.children; track child.name) {
                  <li>
                    <a [routerLink]="['/app', child.route]" routerLinkActive="active" (click)="closeNav()">{{ child.name }}</a>
                  </li>
                }
              </ul>
            } @else {
              <a [routerLink]="['/app', item.route]" routerLinkActive="active" (click)="closeNav()">{{ item.name }}</a>
            }
          </li>
        }
      </ul>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <app-toolbar></app-toolbar>
    <app-breadcrumb></app-breadcrumb>
    <!-- Al cambiar de perfil (público/administrador) se recrea la pantalla para que vuelva a pedir sus datos -->
    @for (profile of [admin.epoch()]; track profile) {
      <router-outlet></router-outlet>
    }
    <app-disclaimer></app-disclaimer>
  </mat-sidenav-content>
</mat-sidenav-container>
