<div class="page-container mat-elevation-z2">
  <div class="header-actions">
    <h2>Tipos de Certificación</h2>
    <button mat-flat-button color="primary" (click)="openCaptureDialog()">
      <mat-icon>add</mat-icon> Nuevo Tipo
    </button>
  </div>

  <table mat-table [dataSource]="certificationTypes" class="full-width-table">
    
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef> Código </th>
      <td mat-cell *matCellDef="let element"> {{element.code}} </td>
    </ng-container>

    <ng-container matColumnDef="points_base">
      <th mat-header-cell *matHeaderCellDef> Puntos por certificarse </th>
      <td mat-cell *matCellDef="let element"> {{element.points_base}} </td>
    </ng-container>

    <ng-container matColumnDef="points_for_course">
      <th mat-header-cell *matHeaderCellDef> Puntos por impartir curso </th>
      <td mat-cell *matCellDef="let element"> {{element.points_for_course}} </td>
    </ng-container>

    <ng-container matColumnDef="points_for_instructor">
      <th mat-header-cell *matHeaderCellDef> Bono expositor </th>
      <td mat-cell *matCellDef="let element"> {{element.points_for_instructor}} </td>
    </ng-container>

    <ng-container matColumnDef="points_for_student">
      <th mat-header-cell *matHeaderCellDef> Bono alumno </th>
      <td mat-cell *matCellDef="let element"> {{element.points_for_student}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="action-column"> Acciones </th>
      <td mat-cell *matCellDef="let element" class="action-column">
        <button mat-icon-button color="primary" (click)="openCaptureDialog(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteCertificationType(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div *ngIf="certificationTypes.length === 0" class="empty-state">
    No hay tipos de certificación registrados.
  </div>
</div>
