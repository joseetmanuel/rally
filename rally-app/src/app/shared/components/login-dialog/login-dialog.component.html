<header class="login-header">
  <span class="login-badge" aria-hidden="true">
    <mat-icon>admin_panel_settings</mat-icon>
  </span>
  <div class="login-heading">
    <h2 mat-dialog-title id="login-title">Acceso de administrador</h2>
    <p class="login-subtitle">
      Inicia sesión para crear, editar o eliminar datos. Sin sesión puedes consultar todo en modo lectura.
    </p>
  </div>
</header>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <mat-dialog-content class="login-content">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Usuario</mat-label>
      <input
        matInput
        type="text"
        formControlName="username"
        autocomplete="username"
        autocapitalize="off"
        spellcheck="false"
        cdkFocusInitial
        required
      />
      <mat-icon matPrefix aria-hidden="true">person_outline</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Contraseña</mat-label>
      <input
        #passwordInput
        matInput
        [type]="hidePassword() ? 'password' : 'text'"
        formControlName="password"
        autocomplete="current-password"
        required
      />
      <mat-icon matPrefix aria-hidden="true">lock_outline</mat-icon>
      <button
        mat-icon-button
        matSuffix
        type="button"
        class="toggle-password"
        [attr.aria-label]="hidePassword() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
        [attr.aria-pressed]="!hidePassword()"
        (click)="togglePassword()"
      >
        <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
    </mat-form-field>

    <div class="login-alert-slot">
      @if (errorMessage(); as msg) {
        <div class="login-alert" role="alert">
          <mat-icon aria-hidden="true">{{ locked() ? 'timer' : 'error_outline' }}</mat-icon>
          <span class="login-alert-text">{{ msg }}</span>
        </div>
      }
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="login-actions">
    <button mat-button type="button" class="cancel-btn" (click)="cancel()">Cancelar</button>
    <button mat-flat-button type="submit" class="submit-btn" [disabled]="!canSubmit">
      @if (submitting()) {
        <mat-progress-spinner mode="indeterminate" diameter="18" aria-label="Enviando"></mat-progress-spinner>
      }
      <span>Iniciar sesión</span>
    </button>
  </mat-dialog-actions>
</form>
