<h2 mat-dialog-title>Registrar Asistente</h2>
<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="capture-form">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Consultor asistente</mat-label>
      <mat-select formControlName="consultant_id" required>
        <mat-option *ngFor="let cons of availableConsultants" [value]="cons.id">
          {{ cons.full_name }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('consultant_id')?.hasError('required')">Requerido</mat-error>
      <mat-hint>No se listan el instructor ni quienes ya están registrados</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Puntaje del cuestionario (Opcional)</mat-label>
      <input matInput formControlName="points_obtained" type="number" min="0">
      <mat-error *ngIf="form.get('points_obtained')?.invalid">No puede ser negativo</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notas (Opcional)</mat-label>
      <textarea matInput formControlName="notes" rows="2"></textarea>
    </mat-form-field>

    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="onSubmit()">
    Guardar
  </button>
</mat-dialog-actions>
