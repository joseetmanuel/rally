<h2 mat-dialog-title>Lista de Asistencia del Curso</h2>
<mat-dialog-content>
  <div class="header-actions">
    <button mat-flat-button color="primary" (click)="openCaptureDialog()">
      <mat-icon>add</mat-icon> Registrar Asistente
    </button>
  </div>

  <table mat-table [dataSource]="attendances" class="full-width-table">
    
    <ng-container matColumnDef="consultant">
      <th mat-header-cell *matHeaderCellDef> Consultor </th>
      <td mat-cell *matCellDef="let element"> 
        {{element.consultant?.full_name || 'ID: ' + element.consultant_id}} 
      </td>
    </ng-container>

    <ng-container matColumnDef="points">
      <th mat-header-cell *matHeaderCellDef> Puntaje del cuestionario </th>
      <td mat-cell *matCellDef="let element"> {{element.points_obtained ?? 0}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="action-column"> Acciones </th>
      <td mat-cell *matCellDef="let element" class="action-column">
        <button mat-icon-button color="warn" title="Eliminar" (click)="deleteAttendance(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div *ngIf="attendances.length === 0" class="empty-state">
    No hay asistentes registrados para este curso.
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
